# ============================================================
#  VirtuaOS 1.0.2-BETA — GRUB Boot Menu (BIOS / Legacy)
# ============================================================

if loadfont $prefix/font.pf2 ; then
  set gfxmode=auto
  insmod efi_gop
  insmod efi_uga
  insmod gfxterm
  terminal_output gfxterm
fi

set default=0
set timeout=10
set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

# Filesystem modules
insmod part_gpt
insmod part_msdos
insmod ext2
insmod iso9660
insmod search_label
insmod search_fs_uuid
insmod all_video

# ── Locate the live filesystem ───────────────────────────────
# Make sure $root points at the ISO9660 partition that holds /live/*,
# independent of which BIOS device GRUB was loaded from. Search by file
# presence first (case-insensitive, label-independent), then fall back to
# the volume label in either case.
search --no-floppy --set=root --file /live/vmlinuz
if [ ! -e /live/vmlinuz ]; then
    search --no-floppy --set=root --label "VirtuaOS-1.0.2-BETA" \
        || search --no-floppy --set=root --label "VIRTUAOS-1.0.2-BETA"
fi

# ── Live image kernel paths (live-build standard layout) ─────
set live_kernel="/live/vmlinuz"
set live_initrd="/live/initrd.img"
set live_args="boot=live components quiet splash username=virtua noeject"

# ── Menu entries ─────────────────────────────────────────────

menuentry "Install VirtuaOS 1.0.2-BETA  (interactive)" --class gnu-linux --class os {
    echo "Loading VirtuaOS Installer (interactive mode)..."
    linux  $live_kernel $live_args vos_mode=install
    initrd $live_initrd
}

menuentry "Install VirtuaOS 1.0.2-BETA  [Auto - choisis disque interne]" --class gnu-linux {
    echo "Loading VirtuaOS Installer (auto mode)..."
    linux  $live_kernel $live_args vos_mode=install-auto
    initrd $live_initrd
}

menuentry "Try VirtuaOS 1.0.2-BETA Live  (no install)" --class gnu-linux {
    echo "Loading VirtuaOS Live..."
    linux  $live_kernel $live_args
    initrd $live_initrd
}

menuentry "VirtuaOS  [Safe graphics]" --class gnu-linux {
    linux  $live_kernel $live_args nomodeset
    initrd $live_initrd
}
